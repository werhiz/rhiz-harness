purpose: ContextPack with measurable composition (included files, selected symbols, history, rules, architecture docs, skills); a deterministic composer that picks fragments by strategy; a LangChain-style ClearToolUsesEdit eviction; an OpenInterpreter-style marker discipline that allows fragments to be found and removed later.
material_changes:
  - Adapted LangChain `ClearToolUsesEdit` (token-threshold-triggered eviction) into a typed `ClearToolUsesEdit` discriminated-union member with `keepRecent` and `minTokens` knobs; the Rhiz version keeps the per-kind token cap shape but drops the trigger-eval async machinery because the kernel composer is deterministic offline.
  - Adapted the OpenInterpreter `ContextualUserFragment` trait into a discriminated-union of six `ContextFragment` kinds (IncludedFile, SelectedSymbol, History, Rule, ArchitectureDoc, Skill); every fragment carries a stable `marker` field so consumers can find and remove it later (the OpenInterpreter marker discipline).
  - Re-implemented Aider's PageRank-on-the-repo in spirit (not in code) as a per-strategy selector; v0.1 uses deterministic sort + strategy-specific limits because PageRank is a v0.2 PR that requires a tree-sitter corpus and a real repo.
  - Added `ContextPackSchema` with a `superRefine` invariant: `totalTokens` must equal the sum of fragment tokenEstimates; markers must be unique and one-per-fragment. The schema rejects any pack that fails this consistency check.
  - Added `classifyTaskClass(contract)` and `defaultStrategyForTaskClass(taskClass)` — defaults: scout→broad, review→balanced, ship→minimal, default→balanced.
  - Added `validateContextBudget(pack, config)` returning a `ContextBudgetBreakdown` with `byKind`, `perKindBudget`, `total`, `totalBudget`, `withinBudget`, `overBudgetKinds`. No events are emitted; the breakdown is a pure data structure that consumers can record via `attempt.activity-observed`.
  - All Zod schemas are portable and strict. The module imports nothing from DSH, Rhiz Protocol, or any concrete host/runtime. Verified by `scripts/check-portable-boundary.mjs`.
  - Six error classes: ContextError, ContextConfigurationError, ContextBudgetExceededError, ContextValidationError. Each carries a stable `code` and a stable `name`.
