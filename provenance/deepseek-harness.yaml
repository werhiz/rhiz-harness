purpose: DSH execution backends for the portable Rhiz Host and Worker contracts, including direct named Codex and Claude Code routes.
material_changes:
  - Translate DSH SDK activity intervals and notifications into portable Rhiz WorkerProvider, WorkerObservation, and WorkerResult contracts.
  - Expose only capabilities reachable through each public DSH boundary; DSH-internal tools, sandbox, filesystem, and process services remain unclaimed.
  - Keep DSH imports outside the portable src/ kernel and load optional DSH dependencies at runtime.
  - Compose the published JSON-RPC runtime with DSH's replay LLM for a keyless end-to-end CI smoke using exact rc.8 packages.
  - Fail closed unless the real DSH worker finishes, emits observations, returns the expected replay proof, and advances Rhiz Board state to verifying without violations.
  - Mount DSH's official Codex and Claude Code one-shot providers in one private Cordis context and invoke their named subagent routes directly without a coordinator-model turn.
  - Publish Rhiz-owned worker identity and native authority metadata while keeping product authentication, native settings, and credential values private.
  - Prove dormant product-provider composition in CI without optional native product payloads, credentials, or paid model calls.
